server {
    listen 9981;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物：长缓存 + immutable（hash 变化会自动失效）
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 固定文件名的 MF 入口与清单：每次都校验，避免发版后旧引用锁死
    # 包含：index.html、version.js、mf-entry-bootstrap-*.js、mf-manifest.json、mf-stats.json、comm(.xxx).js
    location ~* ^/(index\.html|version\.js|mf-entry-bootstrap-\d+\.js|mf-manifest\.json|mf-stats\.json|comm(\..*)?\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # React Router SPA 回退：最终落到 index.html，同样禁缓存
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
